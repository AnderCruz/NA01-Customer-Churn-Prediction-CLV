[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nowa-customer-intelligence"
version = "0.1.0"
description = "Predictive customer intelligence for churn, CLV and customer segmentation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - All rights reserved" }
authors = [{ name = "Nowa Analytics" }]
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "pandera>=0.20,<0.27",
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.8,<3.0",
    "joblib>=1.4,<2.0",
    "openpyxl>=3.1.5,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<5.0",
]
ml = [
    "xgboost>=2.1,<4.0",
    "lightgbm>=4.5,<5.0",
    "catboost>=1.2,<2.0",
    "shap>=0.46,<1.0",
    "mlflow>=2.17,<4.0",
]
dashboard = [
    "streamlit>=1.38,<2.0",
    "plotly>=5.24,<7.0",
]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]
api-test = [
    "httpx2==2.16.2",
]
notebooks = [
    "jupyterlab>=4.2,<5.0",
    "ipykernel>=6.29,<7.0",
    "nbclient>=0.10,<1.0",
    "matplotlib>=3.9,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
